<h1>Macro-Patcher</h1>
<p>Macro-Patcher는 개인용 Google Apps Script 도구입니다. 소유자 본인의 Google Drive 폴더에 올린 패치 파일을 읽어, 소유자 본인의 Apps Script 프로젝트 코드에 적용합니다.</p>
<p>이 도구는 소유자 한 명만 사용하며, 다른 사용자에게 제공되지 않습니다.</p>
